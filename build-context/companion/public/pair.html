<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pair with Kaw's ATS Companion</title><link rel="stylesheet" href="/app.css"></head>
<body><main style="max-width:560px;margin:40px auto;padding:20px"><h1>Connect your second screen</h1><p>This connects to the Companion on your PC. Keep both devices on the same private network.</p>
<form id="pairForm"><label>Device name <input class="v16-input" id="name" maxlength="60" value="My tablet" required></label><p><label><input type="checkbox" id="switch"> Allow this PC to change the screen while this page is open</label></p><button class="cmd" type="submit">Connect and open screen</button></form><p id="status" role="status"></p>
<p>Next time, bookmark the screen after connecting. Pairing links expire after five minutes and work once.</p></main><script src="/pair.js" defer></script></body></html>
