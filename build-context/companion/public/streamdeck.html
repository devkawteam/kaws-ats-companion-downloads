<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020812"><title>KAW ATS • Stream Deck</title>
<style>
:root{color-scheme:dark;--blue:#2a8fff;--green:#53ed63;--red:#ff5f57;--orange:#ff8a13}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#0b2944,#020812 45%);color:#fff;font-family:Segoe UI,Arial,sans-serif;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}h1{margin:0;font-size:clamp(19px,4vw,34px);font-style:italic}h1 span{color:var(--blue)}#status{padding:8px 11px;border:1px solid #1c557d;border-radius:999px;background:#061522;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr));gap:10px}.key{aspect-ratio:1.25;border:1px solid #17659d;border-radius:14px;background:linear-gradient(160deg,#0b2b48,#061321);color:#fff;font-weight:900;font-size:clamp(14px,2vw,22px);padding:12px;box-shadow:inset 0 0 22px rgba(42,143,255,.08),0 8px 20px rgba(0,0,0,.25);cursor:pointer;touch-action:manipulation}.key:active{transform:scale(.97);filter:brightness(1.25)}.key.warn{border-color:var(--orange)}.key.danger{border-color:var(--red);background:linear-gradient(160deg,#491516,#19090c)}.key.good{border-color:var(--green)}.wide{grid-column:span 2;aspect-ratio:auto;min-height:90px}.note{color:#8fa2b5;font-size:12px;margin-top:12px;text-align:center}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.key{min-height:110px;aspect-ratio:auto}}@media(max-width:380px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}@media(orientation:landscape) and (max-height:520px){header{margin-bottom:7px}.grid{grid-template-columns:repeat(4,1fr);gap:7px}.key{min-height:78px;aspect-ratio:auto}.note{display:none}}
</style><link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head><body><header><h1>KAW'S <span>ATS</span> STREAM DECK</h1><div id="status">READY</div></header><main class="grid"><button class="key good" data-command="depart">▶ DEPART</button><button class="key warn" data-command="hold-position">Ⅱ HOLD</button><button class="key" data-command="regroup">◎ REGROUP</button><button class="key" data-command="resume-convoy">↻ RESUME</button><button class="key" data-command="fuel-stop">⛽ FUEL STOP</button><button class="key" data-command="rest-stop">☾ REST STOP</button><button class="key danger wide" data-command="emergency-stop">⚠ EMERGENCY STOP</button></main><div class="note">Use this page on a Stream Deck browser action, phone, or small touch display. Commands are sent to the local Companion.</div><script>const status=document.getElementById('status');document.querySelectorAll('[data-command]').forEach(button=>button.onclick=async()=>{status.textContent='SENDING…';try{const response=await fetch(`/api/streamdeck/${button.dataset.command}`,{method:'POST'});const body=await response.json();if(!response.ok||!body.ok)throw new Error(body.error||`HTTP ${response.status}`);status.textContent=`SENT • ${body.command.type}`;setTimeout(()=>status.textContent='READY',1800)}catch(error){status.textContent=`ERROR • ${error.message}`}})</script></body></html>
