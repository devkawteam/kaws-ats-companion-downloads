<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAW Trip Recap</title>
<!-- Trip recap card and route replay.
     recap.html?trip=last|current|<trip id>  &format=landscape|vertical|square
     &animate=1  replay the route (loops; use as an OBS Browser Source for your outro)
     &obs=1      hide the buttons -->
<style>
  html,body{margin:0;background:#050b12;color:#f4f8ff;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,Arial,sans-serif}
  body.obs{background:transparent;overflow:hidden}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;background:#0a1826;border-bottom:1px solid #16344d}
  .bar select,.bar button{background:#04111c;color:#e8f4ff;border:1px solid #1a4869;border-radius:8px;padding:8px 12px;font:600 14px "Segoe UI",system-ui,sans-serif;cursor:pointer}
  .bar button.primary{background:#1f7ae0;border-color:#1f7ae0}
  .bar .note{color:#9fb6c9;font-size:13px;margin-left:auto}
  body.obs .bar{display:none}
  .stage{display:flex;justify-content:center;padding:16px}
  body.obs .stage{padding:0}
  canvas{max-width:100%;height:auto;border-radius:14px;box-shadow:0 20px 60px -20px rgba(0,0,0,.8)}
  body.obs canvas{border-radius:0;box-shadow:none;max-width:100vw;max-height:100vh}
</style>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body>
<div class="bar">
  <select id="trip"></select>
  <select id="format"><option value="landscape">Landscape 16:9 (YouTube, Discord)</option><option value="vertical">Vertical 9:16 (TikTok, Shorts, Reels)</option><option value="square">Square (Instagram)</option></select>
  <button id="replay" type="button">▶ Replay route</button>
  <button id="download" class="primary" type="button">Download PNG</button>
  <button id="copy" type="button">Copy image</button>
  <span class="note" id="note"></span>
</div>
<div class="stage"><canvas id="c"></canvas></div>
<script>
(() => {
  const P = new URLSearchParams(location.search);
  if (P.get('obs') === '1') document.body.classList.add('obs');
  const $ = id => document.getElementById(id);
  const c = $('c'), x = c.getContext('2d');
  const SIZES = { landscape: [1200, 675], vertical: [1080, 1920], square: [1080, 1080] };
  let format = SIZES[P.get('format')] ? P.get('format') : 'landscape';
  $('format').value = format;
  let data = null, geo = null, anim = null;
  const fin = v => v !== null && v !== undefined && Number.isFinite(Number(v));
  const money = n => `$${Math.round(Number(n) || 0).toLocaleString('en-US')}`;
  const key = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
  const cityLL = name => { const k = key(name); const hit = (geo?.cities || []).find(ci => key(ci.name) === k); return hit ? [hit.lon, hit.lat] : null; };

  function layout(W, H) {
    if (format === 'landscape') return { map: [0, 0, W * 0.6, H], panel: [W * 0.6, 0, W * 0.4, H] };
    if (format === 'vertical') return { map: [0, 0, W, H * 0.56], panel: [0, H * 0.56, W, H * 0.44] };
    return { map: [0, 0, W, H * 0.6], panel: [0, H * 0.6, W, H * 0.4] };
  }

  function draw(progress = 1) {
    const [W, H] = SIZES[format];
    c.width = W; c.height = H;
    const L = layout(W, H);
    const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#06121d'); g.addColorStop(1, '#0c2336');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    const t = data?.trip || {};
    let pts = (data?.points || []).map(p => [p[0], p[1]]);
    const from = cityLL(t.originCity), to = cityLL(t.destinationCity);
    const straight = pts.length < 2;
    if (straight) pts = [from, to].filter(Boolean);
    // Fit the route (plus origin/destination) into the map area.
    const all = [...pts, from, to].filter(Boolean);
    let [minLon, maxLon, minLat, maxLat] = all.length ? [Math.min(...all.map(p => p[0])), Math.max(...all.map(p => p[0])), Math.min(...all.map(p => p[1])), Math.max(...all.map(p => p[1]))] : [-125, -100, 30, 45];
    const padLon = Math.max(0.6, (maxLon - minLon) * 0.18), padLat = Math.max(0.4, (maxLat - minLat) * 0.18);
    minLon -= padLon; maxLon += padLon; minLat -= padLat; maxLat += padLat;
    const [mx, my, mw, mh] = L.map;
    const k = Math.cos((minLat + maxLat) / 2 * Math.PI / 180);
    const s = Math.min(mw * 0.9 / ((maxLon - minLon) * k), mh * 0.85 / (maxLat - minLat));
    const cx = mx + mw / 2, cy = my + mh / 2, clon = (minLon + maxLon) / 2, clat = (minLat + maxLat) / 2;
    const proj = (lon, lat) => [cx + (lon - clon) * k * s, cy - (lat - clat) * s];
    // States / provinces.
    x.save(); x.beginPath(); x.rect(mx, my, mw, mh); x.clip();
    for (const r of geo?.regions || []) {
      x.beginPath();
      for (const ring of r.parts || []) ring.forEach(([lo, la], i) => { const [px, py] = proj(lo, la); i ? x.lineTo(px, py) : x.moveTo(px, py); });
      x.fillStyle = r.country === 'USA' ? '#12304a' : '#0d2438'; x.fill();
      x.strokeStyle = '#27506f'; x.lineWidth = 1.5; x.stroke();
    }
    // Route (glow), drawn up to `progress`.
    if (pts.length >= 2) {
      const n = Math.max(2, Math.round(pts.length * progress));
      const seg = pts.slice(0, n).map(p => proj(p[0], p[1]));
      for (const [w, col, blur] of [[16, 'rgba(39,215,255,.18)', 0], [7, '#27d7ff', 18]]) {
        x.beginPath(); seg.forEach(([px, py], i) => i ? x.lineTo(px, py) : x.moveTo(px, py));
        x.strokeStyle = col; x.lineWidth = w * (W / 1200); x.lineCap = 'round'; x.lineJoin = 'round'; x.shadowColor = '#27d7ff'; x.shadowBlur = blur; x.setLineDash(straight ? [18, 14] : []); x.stroke();
      }
      x.shadowBlur = 0; x.setLineDash([]);
      const head = seg.at(-1);
      if (progress < 1) { x.beginPath(); x.arc(head[0], head[1], 11 * (W / 1200), 0, Math.PI * 2); x.fillStyle = '#ffffff'; x.shadowColor = '#27d7ff'; x.shadowBlur = 24; x.fill(); x.shadowBlur = 0; }
    }
    const pin = (ll, color, label) => {
      if (!ll) return;
      const [px, py] = proj(ll[0], ll[1]), r = 12 * (W / 1200);
      x.beginPath(); x.arc(px, py, r, 0, Math.PI * 2); x.fillStyle = color; x.fill(); x.lineWidth = 4 * (W / 1200); x.strokeStyle = '#fff'; x.stroke();
      x.font = `800 ${Math.round(22 * (W / 1200))}px "Segoe UI",system-ui,sans-serif`; x.fillStyle = '#fff'; x.textAlign = 'center';
      x.shadowColor = '#000'; x.shadowBlur = 8; x.fillText(label || '', px, py - r - 10); x.shadowBlur = 0;
    };
    pin(pts[0] && !straight ? pts[0] : from, '#2ecc71', t.originCity);
    if (progress >= 1) pin(pts.at(-1) && !straight ? pts.at(-1) : to, '#e74c3c', t.destinationCity);
    x.restore();
    // Stats panel.
    const [px, py, pw, ph] = L.panel;
    x.fillStyle = 'rgba(4,12,20,.55)'; x.fillRect(px, py, pw, ph);
    const u = W / (format === 'landscape' ? 1200 : 1080) * (format === 'landscape' ? 1 : 1.15);
    let yy = py + 58 * u;
    const pad = px + 44 * u;
    const text = (str, size, color = '#f4f8ff', weight = 800) => { x.font = `${weight} ${Math.round(size * u)}px "Segoe UI",system-ui,sans-serif`; x.fillStyle = color; x.textAlign = 'left'; x.fillText(str, pad, yy); };
    text("KAW'S ATS PLAYGROUND", 15, '#8fb2cf', 800); yy += 46 * u;
    text(t.status === 'delivered' ? 'DELIVERED' : data?.live ? 'ON THE ROAD' : String(t.status || 'TRIP').toUpperCase(), 17, t.status === 'delivered' ? '#3ee07a' : '#ffd257'); yy += 50 * u;
    text(`${t.originCity || '?'} → ${t.destinationCity || '?'}`, format === 'landscape' ? 34 : 44); yy += 44 * u;
    text(`${t.cargo || 'Cargo'}${fin(t.cargoMassKg) ? ` · ${Math.round(t.cargoMassKg * 2.20462).toLocaleString('en-US')} lb` : ''}`, 22, '#a9c0d8', 600); yy += 62 * u;
    const mins = t.startedAt && (t.endedAt || data?.live) ? Math.round(((t.endedAt ? Date.parse(t.endedAt) : Date.now()) - Date.parse(t.startedAt)) / 60000) : null;
    const tiles = [
      [fin(t.milesDriven) ? Math.round(t.milesDriven).toLocaleString('en-US') : '—', 'miles'],
      [fin(t.deliveredIncome) ? money(t.deliveredIncome) : fin(t.offeredIncome) ? money(t.offeredIncome) : '—', 'earned'],
      [mins !== null ? (mins >= 60 ? `${Math.floor(mins / 60)}h ${mins % 60}m` : `${mins}m`) : '—', 'drive time'],
      [t.eco?.grade ? `${t.eco.grade}` : '—', t.eco?.score ? `eco ${t.eco.score}` : 'eco'],
      [fin(t.maxSpeedMph) ? `${Math.round(t.maxSpeedMph)}` : '—', 'top mph'],
      [fin(t.endCargoDamage) ? `${(Number(t.endCargoDamage) * 100).toFixed(1)}%` : '—', 'cargo damage']
    ];
    const cols = format === 'landscape' ? 2 : 3, tw = (pw - 88 * u) / cols;
    tiles.forEach(([v, l], i) => {
      const tx = pad + (i % cols) * tw, ty = yy + Math.floor(i / cols) * 92 * u;
      x.font = `900 ${Math.round(36 * u)}px "Segoe UI",system-ui,sans-serif`; x.fillStyle = '#ffffff'; x.textAlign = 'left'; x.fillText(v, tx, ty);
      x.font = `700 ${Math.round(15 * u)}px "Segoe UI",system-ui,sans-serif`; x.fillStyle = '#8fb2cf'; x.fillText(l.toUpperCase(), tx, ty + 26 * u);
    });
    yy += Math.ceil(tiles.length / cols) * 92 * u + 10 * u;
    const who = [data?.driverName, [t.truckMake, t.truckModel].filter(Boolean).join(' ')].filter(Boolean).join(' · ');
    text(who, 18, '#dbe8f4', 700); yy += 30 * u;
    text(t.endedAt ? new Date(t.endedAt).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) : '', 16, '#8fb2cf', 600);
    $('note').textContent = straight ? 'No recorded route for this trip — showing a straight line. Routes are recorded from v1.6 on.' : `${(data?.points || []).length} route points`;
  }

  function replay(loop = false) {
    cancelAnimationFrame(anim);
    const t0 = performance.now(), dur = 8000, hold = 4000;
    const frame = now => {
      const el = now - t0;
      draw(Math.min(1, el / dur));
      if (el < dur) anim = requestAnimationFrame(frame);
      else if (loop) setTimeout(() => replay(true), hold);
    };
    anim = requestAnimationFrame(frame);
  }

  async function load(id) {
    const r = await fetch(`/api/stream/recap?trip=${encodeURIComponent(id || P.get('trip') || 'last')}`, { cache: 'no-store' });
    data = await r.json();
    if (data.ok === false) { data = { trip: {}, points: [] }; $('note').textContent = 'No finished trip yet — deliver a load first.'; }
    if (Array.isArray(data.trips) && !$('trip').options.length) {
      $('trip').innerHTML = data.trips.map(t => `<option value="${t.id}">${t.label.replace(/[<>&]/g, '')}</option>`).join('') || '<option value="last">Last trip</option>';
      if (data.trip?.id) $('trip').value = data.trip.id;
    }
    if (P.get('animate') === '1') replay(true); else draw(1);
  }

  $('format').onchange = e => { format = e.target.value; draw(1); };
  $('trip').onchange = e => load(e.target.value);
  $('replay').onclick = () => replay(false);
  $('download').onclick = () => { draw(1); c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `kaw-trip-${(data?.trip?.destinationCity || 'recap').toLowerCase().replace(/\W+/g, '-')}-${format}.png`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }, 'image/png'); };
  $('copy').onclick = () => { draw(1); c.toBlob(async b => { try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': b })]); $('note').textContent = 'Image copied — paste it into Discord or your socials.'; } catch { $('note').textContent = 'Copy not allowed here — use Download.'; } }, 'image/png'); };

  fetch('/natural-earth-na.json').then(r => r.json()).then(j => { geo = j; }).catch(() => {}).finally(() => load());
  if (P.get('trip') === 'current') setInterval(() => load('current'), 15000);
})();
</script>
</body>
</html>
